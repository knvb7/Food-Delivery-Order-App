spring:
  application:
    name: food-delivery
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/food-delivery;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  error:
    include-message: never
app:
  demo:
    enabled: ${DEMO_DATA:true}
  notifications:
    enabled: true
    delay-ms: 500
