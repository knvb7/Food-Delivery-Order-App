spring.application.name=food-delivery

# H2 database
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/food-delivery;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=16

# JPA persistence
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Request validation and error responses
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never

# Demo data and asynchronous notifications
app.demo.enabled=${DEMO_DATA:true}
app.notifications.enabled=true
app.notifications.delay-ms=500
